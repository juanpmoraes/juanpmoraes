name: Claude Assistant

# Responde quando alguém menciona "@claude" em um comentário de issue ou PR,
# permitindo pedir ajustes, explicações ou correções diretamente pelo GitHub.
# Requer o segredo ANTHROPIC_API_KEY configurado em
# Settings → Secrets and variables → Actions.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  respond:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Claude Code
        # continue-on-error: o secrets context não pode ser testado em `if:`
        # de job, então até o ANTHROPIC_API_KEY existir (ver AUTOMATIONS.md)
        # este step falha sem derrubar o check da CI.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
