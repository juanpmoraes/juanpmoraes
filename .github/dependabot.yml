version: 2
updates:
  # Mantém as GitHub Actions usadas nos workflows sempre atualizadas.
  # O Dependabot abre PRs automaticamente quando há novas versões.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
